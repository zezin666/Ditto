<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <defs>
    <clipPath id="winClipLight"><rect x="0" y="0" width="420" height="460" rx="12"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A919C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="620" fill="#E9ECF2"/>
  <text x="30" y="28" font-size="15" font-weight="600" fill="#1B1F24">Ditto quick paste — LIGHT · 420×460 logical px @ 96 DPI</text>
  <text x="30" y="47" font-size="11" fill="#5C6470">1 SVG unit = 1 logical px at 96 DPI. Multiply by DPI/96 at runtime. Mockup — not a screenshot.</text>
  <text x="30" y="62" font-size="11" fill="#5C6470">Right caption 34 (default) · bottom bar 40 · row pitch 30 · search 34 · window radius 12</text>

  <!-- window -->
  <g transform="translate(30,78)">
    <rect x="0" y="0" width="420" height="460" rx="12" fill="#F7F8FA"/>
    <g clip-path="url(#winClipLight)">
      <!-- caption strip (right) -->
      <rect x="386" y="0" width="34" height="460" fill="#F1F3F6"/>
      <line x1="386" y1="0" x2="386" y2="460" stroke="#E3E6EC" stroke-width="1"/>

      <!-- caption buttons -->
      <rect x="389" y="3" width="28" height="28" rx="6" fill="#F0F3F8"/>
      <g stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M399 13 L407 21 M407 13 L399 21"/>
      </g>
      <rect x="389" y="35" width="28" height="28" rx="6" fill="none"/>
      <g stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M399 45 L407 49 L399 53"/>
      </g>

      <!-- vertical title -->
      <text transform="rotate(-90 403 292)" x="403" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1B1F24">Ditto</text>
      <circle cx="403" cy="430" r="3" fill="#2563EB"/>

      <!-- list rows -->
      <!-- row 1: selected -->
      <rect x="8" y="8" width="370" height="28" rx="6" fill="#E8F0FF"/>
      <rect x="12" y="15" width="3" height="14" rx="1.5" fill="#2563EB"/>
      <text x="16" y="26" font-size="11" fill="#5C6470">1</text>
      <line x1="30" y1="15" x2="30" y2="29" stroke="#CFD3DB" stroke-width="1"/>
      <g stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M36 22 h4 l2 2 h5 v8 h-11 z"/>
      </g>
      <text x="58" y="27" font-size="13" fill="#1B1F24">Lorem ipsum dolor sit amet, consectetur…</text>

      <!-- row 2: hover, pinned -->
      <rect x="8" y="38" width="370" height="28" rx="6" fill="#F0F3F8"/>
      <text x="16" y="56" font-size="11" fill="#5C6470">2</text>
      <line x1="30" y1="45" x2="30" y2="59" stroke="#CFD3DB" stroke-width="1"/>
      <g fill="#8A5A00">
        <path d="M44 43 l2.2 4.5 5 .7 -3.6 3.5 .9 5 -4.5 -2.4 -4.5 2.4 .9 -5 -3.6 -3.5 5 -.7 z"/>
      </g>
      <text x="58" y="57" font-size="13" fill="#1B1F24">https://github.com/sabrogden/Ditto</text>

      <!-- row 3: pasted -->
      <text x="16" y="86" font-size="11" fill="#5C6470">3</text>
      <line x1="30" y1="75" x2="30" y2="89" stroke="#CFD3DB" stroke-width="1"/>
      <rect x="12" y="75" width="3" height="14" rx="1.5" fill="#1F7A4D"/>
      <g stroke="#1F7A4D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M350 83 l3 3 6 -7"/>
      </g>
      <text x="58" y="87" font-family="Consolas, Cascadia Mono, monospace" font-size="12" fill="#1B1F24">SELECT lID, mText FROM Main WHERE …</text>

      <!-- row 4: image -->
      <text x="16" y="116" font-size="11" fill="#5C6470">4</text>
      <line x1="30" y1="105" x2="30" y2="119" stroke="#CFD3DB" stroke-width="1"/>
      <rect x="36" y="99" width="40" height="28" rx="4" fill="#FFFFFF" stroke="#E3E6EC" stroke-width="1"/>
      <rect x="40" y="103" width="7" height="7" fill="#E9ECF2"/>
      <rect x="54" y="103" width="7" height="7" fill="#E9ECF2"/>
      <rect x="40" y="117" width="7" height="7" fill="#E9ECF2"/>
      <rect x="54" y="117" width="7" height="7" fill="#E9ECF2"/>
      <path d="M58 110 l8 10 h-16 z" fill="#9AA1AC"/>
      <text x="86" y="117" font-size="13" fill="#1B1F24">Screenshot 2026-11-10 142233.png</text>

      <!-- row 5: colour -->
      <text x="16" y="146" font-size="11" fill="#5C6470">5</text>
      <line x1="30" y1="135" x2="30" y2="149" stroke="#CFD3DB" stroke-width="1"/>
      <rect x="36" y="129" width="16" height="16" rx="3" fill="#FF6B6B" stroke="#E3E6EC" stroke-width="1"/>
      <text x="58" y="147" font-family="Consolas, Cascadia Mono, monospace" font-size="12" fill="#1B1F24">#FF6B6B</text>

      <!-- rows 6-13 -->
      <text x="16" y="176" font-size="11" fill="#5C6470">6</text><line x1="30" y1="165" x2="30" y2="179" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="177" font-family="Consolas, Cascadia Mono, monospace" font-size="12" fill="#1B1F24">npm run build &amp;&amp; npm test</text>

      <text x="16" y="206" font-size="11" fill="#5C6470">7</text><line x1="30" y1="195" x2="30" y2="209" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="207" font-size="13" fill="#1B1F24">Meeting notes — UI modernization kickoff</text>

      <text x="16" y="236" font-size="11" fill="#5C6470">8</text><line x1="30" y1="225" x2="30" y2="239" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="237" font-size="13" fill="#1B1F24">https://learn.microsoft.com/windows/apps/…</text>

      <text x="16" y="266" font-size="11" fill="#5C6470">9</text><line x1="30" y1="255" x2="30" y2="269" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="267" font-family="Consolas, Cascadia Mono, monospace" font-size="12" fill="#1B1F24">{ "theme": "Modern Dark", "dpi": 144 }</text>

      <text x="16" y="296" font-size="11" fill="#5C6470">10</text><line x1="30" y1="285" x2="30" y2="299" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="297" font-size="13" fill="#1B1F24">Ditto is a clipboard manager for Windows</text>

      <text x="16" y="326" font-size="11" fill="#5C6470">0</text><line x1="30" y1="315" x2="30" y2="329" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="327" font-size="13" fill="#1B1F24">Ctrl+` to open</text>

      <text x="16" y="356" font-size="11" fill="#5C6470">1</text><line x1="30" y1="345" x2="30" y2="359" stroke="#CFD3DB" stroke-width="1"/>
      <text x="58" y="357" font-size="13" fill="#1B1F24">Pinned clip — always on top of the list</text>

      <!-- scrollbar thumb -->
      <rect x="378" y="40" width="6" height="150" rx="3" fill="#C4C9D2"/>

      <!-- bottom bar -->
      <rect x="0" y="420" width="386" height="40" fill="#F1F3F6"/>
      <line x1="0" y1="420" x2="386" y2="420" stroke="#E3E6EC" stroke-width="1"/>
      <rect x="6" y="426" width="28" height="28" rx="6" fill="#F0F3F8"/>
      <g stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M14 440 h5 l2 2 h6 v8 h-13 z"/>
      </g>
      <rect x="352" y="426" width="28" height="28" rx="6" fill="none"/>
      <g fill="#5C6470"><circle cx="366" cy="436" r="1.6"/><circle cx="366" cy="440" r="1.6"/><circle cx="366" cy="444" r="1.6"/></g>

      <!-- search (focused) -->
      <rect x="42" y="423" width="302" height="34" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <g stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" fill="none">
        <circle cx="58" cy="439" r="6"/><path d="M62.5 443.5 L68 449"/>
      </g>
      <text x="76" y="445" font-size="13" fill="#5C6470">Search</text>
      <line x1="76" y1="431" x2="76" y2="449" stroke="#2563EB" stroke-width="1"/>
      <g stroke="#5C6470" stroke-width="1.5" stroke-linecap="round" fill="none">
        <path d="M326 437 l4 4 l4 -4"/>
      </g>
    </g>
    <rect x="0.5" y="0.5" width="419" height="459" rx="12" fill="none" stroke="#E3E6EC" stroke-width="1"/>
  </g>

  <!-- dimension annotations -->
  <g stroke="#8A919C" stroke-width="1" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="30" y1="70" x2="450" y2="70"/>
    <line x1="460" y1="78" x2="460" y2="538"/>
    <line x1="416" y1="552" x2="450" y2="552"/>
    <line x1="18" y1="498" x2="18" y2="538"/>
    <line x1="18" y1="86" x2="18" y2="114"/>
  </g>
  <text x="240" y="65" text-anchor="middle" font-size="11" fill="#5C6470">420</text>
  <text x="466" y="312" font-size="11" fill="#5C6470">460</text>
  <text x="433" y="567" text-anchor="middle" font-size="11" fill="#5C6470">34</text>
  <text x="24" y="522" font-size="11" fill="#5C6470">40</text>
  <text x="24" y="104" font-size="11" fill="#5C6470">30</text>

  <!-- right legend -->
  <text x="500" y="90" font-size="13" font-weight="600" fill="#1B1F24">Light tokens</text>
  <g font-size="11" fill="#1B1F24">
    <rect x="500" y="102" width="14" height="14" rx="3" fill="#F7F8FA" stroke="#E3E6EC"/><text x="522" y="113">Canvas #F7F8FA</text>
    <rect x="500" y="124" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#E3E6EC"/><text x="522" y="135">Surface #FFFFFF</text>
    <rect x="500" y="146" width="14" height="14" rx="3" fill="#F1F3F6" stroke="#E3E6EC"/><text x="522" y="157">SurfaceAlt #F1F3F6</text>
    <rect x="500" y="168" width="14" height="14" rx="3" fill="#E3E6EC"/><text x="522" y="179">Border #E3E6EC</text>
    <rect x="500" y="190" width="14" height="14" rx="3" fill="#1B1F24"/><text x="522" y="201">TextPrimary #1B1F24</text>
    <rect x="500" y="212" width="14" height="14" rx="3" fill="#5C6470"/><text x="522" y="223">TextSecondary #5C6470</text>
    <rect x="500" y="234" width="14" height="14" rx="3" fill="#2563EB"/><text x="522" y="245">Accent #2563EB</text>
    <rect x="500" y="256" width="14" height="14" rx="3" fill="#E8F0FF" stroke="#CFD3DB"/><text x="522" y="267">Selection #E8F0FF</text>
    <rect x="500" y="278" width="14" height="14" rx="3" fill="#F0F3F8" stroke="#E3E6EC"/><text x="522" y="289">Hover #F0F3F8</text>
    <rect x="500" y="300" width="14" height="14" rx="3" fill="#1F7A4D"/><text x="522" y="311">Pasted #1F7A4D</text>
    <rect x="500" y="322" width="14" height="14" rx="3" fill="#8A5A00"/><text x="522" y="333">Pinned #8A5A00</text>
    <rect x="500" y="344" width="14" height="14" rx="3" fill="#C43C3C"/><text x="522" y="355">Danger #C43C3C</text>
  </g>

  <text x="500" y="386" font-size="13" font-weight="600" fill="#1B1F24">Anatomy</text>
  <g font-size="11" fill="#5C6470">
    <text x="500" y="406">● Selected row: Selection fill + 3px Accent bar</text>
    <text x="500" y="424">● Hover row: Hover fill, selection untouched</text>
    <text x="500" y="442">● Pasted: 3px Pasted bar + check glyph</text>
    <text x="500" y="460">● Pinned: Pinned star, 16px</text>
    <text x="500" y="478">● Focus ring: 2px Accent inside control</text>
    <text x="500" y="496">● Caption: 34px strip, 28px buttons</text>
    <text x="500" y="514">● Search: 34px, radius 8, 2px focus ring</text>
    <text x="500" y="532">● Bottom bar: 40px, 28px icon buttons</text>
    <text x="500" y="550">● Scrollbar: 6px thumb (10px hover)</text>
  </g>
  <text x="500" y="584" font-size="10" fill="#8A919C">Mockup only. Fonts render with the viewer's Segoe UI.</text>
</svg>
