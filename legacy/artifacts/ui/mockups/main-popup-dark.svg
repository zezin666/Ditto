    <text x="500" y="442">● Hover: #2F3238, selection untouched</text>
    <text x="500" y="460">● Pasted: 3px #4CC38A bar + check glyph</text>
    <text x="500" y="478">● Search match: #2E3A52 bg + primary text</text>
    <text x="500" y="496">● Focus ring: 2px #6C9BFF</text>
    <text x="500" y="514">● No white text on light-blue accent fills</text>
    <text x="500" y="532">● Scrollbar: #4E535C thumb on dark track</text>
