    <rect x="500" y="300" width="14" height="14" rx="3" fill="#2F3238" stroke="#383B41"/><text x="522" y="311">Hover #2F3238</text>
    <rect x="500" y="322" width="14" height="14" rx="3" fill="#4CC38A"/><text x="522" y="333">Pasted #4CC38A</text>
