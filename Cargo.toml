[workspace]
resolver = "2"
members = [
    "apps/ditto-popup",
    "apps/ditto-uac-helper",
    "apps/ditto/src-tauri",
    "crates/ditto-clipboard",
    "crates/ditto-ipc",
    "crates/ditto-migration",
    "crates/ditto-model",
    "crates/ditto-paste",
    "crates/ditto-storage",
    "crates/ditto-uac-helper",
    "crates/ditto-ui-tokens",
    "crates/ditto-win",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.85"
authors = ["Ditto contributors"]

[workspace.dependencies]
anyhow = "1"
eframe = "0.32"
egui = "0.32"
log = "0.4"
parking_lot = "0.12"
raw-window-handle = "0.6"
rusqlite = { version = "0.37", features = ["backup", "bundled", "functions"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.61"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true

